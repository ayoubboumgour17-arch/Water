<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>يوميتي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0f;
  --card: #13131f;
  --card2: #1a1a2e;
  --purple: #7c3aed;
  --purple-light: #a855f7;
  --pink: #ec4899;
  --cyan: #06b6d4;
  --green: #10b981;
  --orange: #f59e0b;
  --red: #ef4444;
  --yellow: #fbbf24;
  --text: #f0f0ff;
  --muted: #6b7280;
  --border: rgba(124,58,237,0.3);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  background: var(--bg);
  min-height: 100vh;
  font-family: 'Cairo', sans-serif;
  color: var(--text);
  overflow-x: hidden;
}

body::before {
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(ellipse at 10% 20%, rgba(124,58,237,0.25) 0%, transparent 50%),
    radial-gradient(ellipse at 90% 80%, rgba(236,72,153,0.2) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(6,182,212,0.1) 0%, transparent 60%);
  pointer-events:none;
  z-index:0;
}

.tabs {
  position:fixed;
  top:0; left:0; right:0;
  display:flex;
  background:rgba(10,10,15,0.95);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  z-index:100;
  padding: 0 4px;
}

.tab-btn {
  flex:1;
  padding:14px 4px;
  background:transparent;
  border:none;
  color: var(--muted);
  font-family:'Cairo',sans-serif;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  transition:all 0.3s;
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
}

.tab-btn .tab-icon { font-size:20px; }

.tab-btn.active { color: var(--purple-light); }

.tab-btn.active::after {
  content:'';
  position:absolute;
  bottom:0; left:10%; right:10%;
  height:3px;
  background:linear-gradient(90deg,var(--purple),var(--pink));
  border-radius:3px 3px 0 0;
}

.page { display:none; padding: 76px 16px 100px; position:relative; z-index:1; }
.page.active { display:block; }

.day-header {
  text-align:center;
  margin-bottom:20px;
}

.day-header h1 {
  font-family:'Tajawal',sans-serif;
  font-size:32px;
  font-weight:900;
  background:linear-gradient(135deg,var(--purple-light),var(--pink),var(--cyan));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  line-height:1.1;
}

.day-header .date-str {
  font-size:13px;
  color:var(--muted);
  margin-top:4px;
}

.progress-wrap {
  background:var(--card);
  border-radius:16px;
  padding:16px;
  margin-bottom:20px;
  border:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:16px;
}

.big-progress { flex:1; }

.big-progress-label {
  display:flex;
  justify-content:space-between;
  font-size:12px;
  color:var(--muted);
  margin-bottom:8px;
}

.big-progress-bar {
  height:10px;
  background:rgba(255,255,255,0.08);
  border-radius:10px;
  overflow:hidden;
}

.big-progress-fill {
  height:100%;
  background:linear-gradient(90deg,var(--purple),var(--pink),var(--cyan));
  border-radius:10px;
  transition:width 0.6s cubic-bezier(0.4,0,0.2,1);
  width:0%;
}

.circle-progress {
  position:relative;
  width:64px;
  height:64px;
  flex-shrink:0;
}

.circle-progress svg { transform:rotate(-90deg); }
.circle-progress .track { fill:none; stroke:rgba(255,255,255,0.08); stroke-width:6; }
.circle-progress .fill {
  fill:none;
  stroke:url(#grad);
  stroke-width:6;
  stroke-linecap:round;
  stroke-dasharray:163;
  stroke-dashoffset:163;
  transition:stroke-dashoffset 0.6s cubic-bezier(0.4,0,0.2,1);
}

.circle-center {
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.circle-center .num {
  font-size:18px;
  font-weight:900;
  color:var(--purple-light);
  line-height:1;
}

.circle-center .of { font-size:9px; color:var(--muted); }

.habits-grid {
  display:flex;
  flex-direction:column;
  gap:10px;
}

.habit-card {
  background:var(--card);
  border-radius:16px;
  border:1px solid rgba(255,255,255,0.07);
  overflow:hidden;
  position:relative;
}

.habit-card::before {
  content:'';
  position:absolute;
  top:0; right:0;
  width:4px;
  height:100%;
  background:var(--accent);
}

.habit-inner {
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 18px 14px 14px;
}

.habit-emoji {
  font-size:28px;
  flex-shrink:0;
}

.habit-info { flex:1; min-width:0; }

.habit-name {
  font-size:14px;
  font-weight:700;
  color:var(--text);
  line-height:1.3;
}

.habit-sub {
  font-size:11px;
  color:var(--muted);
  margin-top:2px;
}

.check-btn {
  flex-shrink:0;
  width:44px;
  height:44px;
  border-radius:50%;
  border:2px solid var(--accent);
  background:transparent;
  color:var(--accent);
  font-size:20px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:all 0.3s ease;
  font-family:'Cairo',sans-serif;
}

.check-btn:active {
  background:var(--accent);
  color:#fff;
  box-shadow:0 0 20px var(--accent);
  transform:scale(0.9);
}

@keyframes dissolve {
  0% { opacity:1; transform:translateX(0) scale(1); max-height:120px; margin-bottom:10px; }
  50% { opacity:0.3; transform:translateX(60px) scale(0.95); }
  100% { opacity:0; transform:translateX(120px) scale(0.8); max-height:0; margin-bottom:0; padding:0; }
}

.habit-card.dissolving {
  animation: dissolve 0.55s cubic-bezier(0.4,0,0.2,1) forwards;
  pointer-events:none;
}

.all-done {
  display:none;
  text-align:center;
  padding:40px 20px;
}

.all-done.show { display:block; animation:fadeUp 0.5s ease; }

@keyframes fadeUp {
  from { opacity:0; transform:translateY(30px); }
  to { opacity:1; transform:translateY(0); }
}

.all-done-emoji { font-size:64px; margin-bottom:16px; }

.all-done h2 {
  font-family:'Tajawal',sans-serif;
  font-size:28px;
  font-weight:900;
  background:linear-gradient(135deg,var(--green),var(--cyan));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  margin-bottom:8px;
}

.all-done p { color:var(--muted); font-size:14px; }

/* MONTH */
.month-header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}

.month-title {
  font-family:'Tajawal',sans-serif;
  font-size:22px;
  font-weight:900;
  background:linear-gradient(135deg,var(--cyan),var(--purple-light));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}

.month-nav { display:flex; gap:8px; }

.nav-btn {
  width:36px; height:36px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--purple-light);
  font-size:16px;
  cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:all 0.2s;
}

.nav-btn:active { transform:scale(0.9); background:var(--purple); color:#fff; }

.stats-row {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:20px;
}

.stat-card {
  background:var(--card);
  border-radius:14px;
  padding:14px 10px;
  text-align:center;
  border:1px solid var(--border);
}

.stat-num {
  font-family:'Tajawal',sans-serif;
  font-size:28px;
  font-weight:900;
  line-height:1;
}

.stat-label { font-size:10px; color:var(--muted); margin-top:4px; line-height:1.3; }

.cal-grid {
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:4px;
  margin-bottom:20px;
}

.cal-day-name {
  text-align:center;
  font-size:11px;
  font-weight:700;
  color:var(--muted);
  padding:6px 0;
}

.cal-cell {
  aspect-ratio:1;
  border-radius:10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:700;
  position:relative;
  background:var(--card);
  border:1px solid rgba(255,255,255,0.04);
}

.cal-cell.empty { background:transparent; border-color:transparent; }

.cal-cell.today {
  border-color:var(--purple);
  box-shadow:0 0 12px rgba(124,58,237,0.4);
}

.cal-cell.full-day {
  background:rgba(16,185,129,0.12);
  border-color:rgba(16,185,129,0.4);
}

.cal-cell .day-num { line-height:1; color:var(--text); font-size:12px; }

.pct-bar {
  position:absolute;
  bottom:3px;
  left:3px; right:3px;
  height:3px;
  border-radius:2px;
  background:rgba(255,255,255,0.06);
  overflow:hidden;
}

.pct-fill { height:100%; border-radius:2px; transition:width 0.4s; }

.habit-breakdown {
  background:var(--card);
  border-radius:16px;
  padding:16px;
  border:1px solid var(--border);
}

.breakdown-title {
  font-size:14px;
  font-weight:700;
  color:var(--purple-light);
  margin-bottom:14px;
}

.breakdown-row {
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
}

.breakdown-icon { font-size:18px; flex-shrink:0; }

.breakdown-info { flex:1; min-width:0; }

.breakdown-name {
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin-bottom:4px;
}

.breakdown-bar-wrap {
  height:6px;
  background:rgba(255,255,255,0.07);
  border-radius:6px;
  overflow:hidden;
}

.breakdown-bar-fill { height:100%; border-radius:6px; transition:width 0.6s; }

.breakdown-pct {
  font-size:11px;
  font-weight:700;
  flex-shrink:0;
  width:32px;
  text-align:left;
}

.toast {
  position:fixed;
  bottom:90px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  background:linear-gradient(135deg,var(--purple),var(--pink));
  color:#fff;
  padding:10px 20px;
  border-radius:30px;
  font-size:13px;
  font-weight:700;
  z-index:200;
  opacity:0;
  transition:all 0.4s cubic-bezier(0.4,0,0.2,1);
  white-space:nowrap;
  box-shadow:0 8px 30px rgba(124,58,237,0.5);
}

.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

.sparkle {
  position:fixed;
  pointer-events:none;
  z-index:300;
  font-size:28px;
  animation:sparkleAnim 0.8s ease forwards;
}

@keyframes sparkleAnim {
  0% { opacity:1; transform:scale(0.5) translateY(0); }
  50% { opacity:1; transform:scale(1.3) translateY(-50px); }
  100% { opacity:0; transform:scale(0.8) translateY(-100px); }
}
</style>
</head>
<body>

<svg style="position:absolute;width:0;height:0">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="50%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>
</svg>

<div class="tabs">
  <button class="tab-btn active" onclick="showPage('today')">
    <span class="tab-icon">✅</span>اليوم
  </button>
  <button class="tab-btn" onclick="showPage('month')">
    <span class="tab-icon">📅</span>الشهر
  </button>
</div>

<!-- TODAY -->
<div class="page active" id="page-today">
  <div class="day-header">
    <h1 id="greeting">أهلاً!</h1>
    <div class="date-str" id="date-str">—</div>
  </div>

  <div class="progress-wrap">
    <div class="big-progress">
      <div class="big-progress-label">
        <span>التقدم اليومي</span>
        <span id="prog-label">0 / 9</span>
      </div>
      <div class="big-progress-bar">
        <div class="big-progress-fill" id="prog-fill"></div>
      </div>
    </div>
    <div class="circle-progress">
      <svg width="64" height="64" viewBox="0 0 64 64">
        <circle class="track" cx="32" cy="32" r="26"/>
        <circle class="fill" cx="32" cy="32" r="26" id="circle-fill"/>
      </svg>
      <div class="circle-center">
        <span class="num" id="circle-num">0</span>
        <span class="of">/ 9</span>
      </div>
    </div>
  </div>

  <div class="habits-grid" id="habits-grid"></div>

  <div class="all-done" id="all-done">
    <div class="all-done-emoji">🏆</div>
    <h2>أنجزت كل شيء!</h2>
    <p>يوم رائع! عاداتك ستعود غداً من جديد 🌙</p>
  </div>
</div>

<!-- MONTH -->
<div class="page" id="page-month">
  <div class="month-header">
    <div class="month-title" id="month-title">—</div>
    <div class="month-nav">
      <button class="nav-btn" onclick="changeMonth(-1)">›</button>
      <button class="nav-btn" onclick="changeMonth(1)">‹</button>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-num" id="stat-streak" style="color:#f59e0b">0</div>
      <div class="stat-label">أيام متتالية 🔥</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="stat-perfect" style="color:#10b981">0</div>
      <div class="stat-label">أيام مثالية ✨</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="stat-total" style="color:#a855f7">0</div>
      <div class="stat-label">إجمالي منجز</div>
    </div>
  </div>

  <div class="cal-grid" id="cal-grid"></div>

  <div class="habit-breakdown">
    <div class="breakdown-title">📊 نسبة إنجاز كل عادة هذا الشهر</div>
    <div id="breakdown-list"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const HABITS = [
  { id:'quran',   icon:'📖', name:'قراءة صفحتين من القرآن',      sub:'قراءة يومية',            color:'#7c3aed' },
  { id:'podcast', icon:'🎧', name:'بودكاست فرنسي 15 دقيقة',      sub:'Podcast français',       color:'#ec4899' },
  { id:'book',    icon:'📚', name:'قراءة صفحتين بالفرنسية',      sub:'Lecture en français',    color:'#06b6d4' },
  { id:'conj',    icon:'✏️', name:'تصريف فرنسي 10 دقائق',        sub:'Conjugaison',            color:'#10b981' },
  { id:'speak',   icon:'💬', name:'محادثة فرنسية 15 دقيقة',      sub:'Conversation française', color:'#f59e0b' },
  { id:'write',   icon:'🖊️', name:'كتابة صفحة من أفكاري',        sub:'يوميتي الكتابية',        color:'#a855f7' },
  { id:'domains', icon:'🔍', name:'البحث عن الدومينات',           sub:'فرص الأعمال',            color:'#ef4444' },
  { id:'client',  icon:'🤝', name:'البحث عن عميل لموقع',         sub:'Freelance web',          color:'#fbbf24' },
  { id:'review',  icon:'📝', name:'مراجعة الدروس',               sub:'Révision quotidienne',   color:'#06b6d4' },
];

const TOTAL = HABITS.length;
let viewMonth = new Date().getMonth();
let viewYear  = new Date().getFullYear();

function todayKey() { return new Date().toISOString().slice(0,10); }
function dayKey(y,m,d) { return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
function getDayData(k) { try { return JSON.parse(localStorage.getItem('h_'+k)||'{}'); } catch { return {}; } }
function setDayData(k,d) { localStorage.setItem('h_'+k, JSON.stringify(d)); }
function getTodayData() { return getDayData(todayKey()); }
function setTodayData(d) { setDayData(todayKey(), d); }

function doneCount(data) { return Object.values(data).filter(Boolean).length; }

function setGreeting() {
  const h = new Date().getHours();
  document.getElementById('greeting').textContent =
    h < 12 ? 'صباح الخير! ☀️' : h < 18 ? 'مساء النور! 🌤️' : 'مساء الخير! 🌙';
  document.getElementById('date-str').textContent =
    new Date().toLocaleDateString('ar-DZ',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
}

function renderToday() {
  const data = getTodayData();
  const grid = document.getElementById('habits-grid');
  grid.innerHTML = '';
  let done = doneCount(data);

  HABITS.forEach(h => {
    if (data[h.id]) return; // already done → don't show
    const card = document.createElement('div');
    card.className = 'habit-card';
    card.id = 'card-'+h.id;
    card.style.setProperty('--accent', h.color);
    card.innerHTML = `
      <div class="habit-inner">
        <span class="habit-emoji">${h.icon}</span>
        <div class="habit-info">
          <div class="habit-name">${h.name}</div>
          <div class="habit-sub">${h.sub}</div>
        </div>
        <button class="check-btn" style="border-color:${h.color};color:${h.color}"
          onclick="completeHabit('${h.id}',this,event)">✓</button>
      </div>`;
    grid.appendChild(card);
  });

  updateProgress(done);
  document.getElementById('all-done').classList.toggle('show', done === TOTAL);
}

function updateProgress(done) {
  const pct = done / TOTAL * 100;
  document.getElementById('prog-fill').style.width = pct+'%';
  document.getElementById('prog-label').textContent = done+' / '+TOTAL;
  document.getElementById('circle-num').textContent = done;
  document.getElementById('circle-fill').style.strokeDashoffset = 163*(1-done/TOTAL);
}

function completeHabit(id, btn, ev) {
  // sparkle at tap position
  const sp = document.createElement('div');
  sp.className = 'sparkle';
  sp.textContent = '✨';
  sp.style.left = (ev.clientX-20)+'px';
  sp.style.top  = (ev.clientY-20)+'px';
  document.body.appendChild(sp);
  setTimeout(()=>sp.remove(), 900);

  const card = document.getElementById('card-'+id);
  card.classList.add('dissolving');

  const data = getTodayData();
  data[id] = true;
  setTodayData(data);

  const done = doneCount(data);
  updateProgress(done);

  setTimeout(()=>{
    card.remove();
    if (done === TOTAL) document.getElementById('all-done').classList.add('show');
  }, 580);

  showToast('✅ '+HABITS.find(h=>h.id===id).name);
}

// ── MONTH ──
const MONTH_AR = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

function changeMonth(dir) {
  viewMonth += dir;
  if (viewMonth>11){viewMonth=0;viewYear++;}
  if (viewMonth<0){viewMonth=11;viewYear--;}
  renderMonth();
}

function renderMonth() {
  document.getElementById('month-title').textContent = MONTH_AR[viewMonth]+' '+viewYear;

  const today      = new Date();
  const firstDay   = new Date(viewYear,viewMonth,1).getDay();
  const daysInMon  = new Date(viewYear,viewMonth+1,0).getDate();

  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';
  ['أح','إث','ثل','أر','خم','جم','سب'].forEach(d=>{
    const el=document.createElement('div');
    el.className='cal-day-name';
    el.textContent=d;
    grid.appendChild(el);
  });
  for(let i=0;i<firstDay;i++){
    const el=document.createElement('div'); el.className='cal-cell empty'; grid.appendChild(el);
  }

  let totalDone=0, perfectDays=0, streak=0, streakOn=true;

  // streak: count backwards from today
  if(today.getMonth()===viewMonth && today.getFullYear()===viewYear){
    for(let d=today.getDate();d>=1;d--){
      const k=dayKey(viewYear,viewMonth,d);
      const cnt=doneCount(getDayData(k));
      if(streakOn && cnt===TOTAL) streak++;
      else streakOn=false;
    }
  }

  for(let d=1;d<=daysInMon;d++){
    const k=dayKey(viewYear,viewMonth,d);
    const data=getDayData(k);
    const cnt=doneCount(data);
    totalDone+=cnt;
    const isFuture=new Date(viewYear,viewMonth,d)>today;
    const isToday=d===today.getDate()&&viewMonth===today.getMonth()&&viewYear===today.getFullYear();
    if(!isFuture && cnt===TOTAL) perfectDays++;

    const pctNum=isFuture?0:cnt/TOTAL;
    const fillW=Math.round(pctNum*100)+'%';
    let fillColor='#ef4444';
    if(pctNum>=1) fillColor='linear-gradient(90deg,#10b981,#06b6d4)';
    else if(pctNum>=0.66) fillColor='#10b981';
    else if(pctNum>=0.33) fillColor='#f59e0b';

    const el=document.createElement('div');
    el.className='cal-cell'+(isToday?' today':'')+((!isFuture&&cnt===TOTAL)?' full-day':'');
    el.innerHTML=`<span class="day-num">${d}</span>`+
      (!isFuture&&cnt>0?`<div class="pct-bar"><div class="pct-fill" style="width:${fillW};background:${fillColor}"></div></div>`:'');
    grid.appendChild(el);
  }

  document.getElementById('stat-streak').textContent=streak;
  document.getElementById('stat-perfect').textContent=perfectDays;
  document.getElementById('stat-total').textContent=totalDone;
  renderBreakdown(today, daysInMon);
}

function renderBreakdown(today, daysInMon) {
  const list=document.getElementById('breakdown-list');
  list.innerHTML='';
  HABITS.forEach(h=>{
    let cnt=0,days=0;
    for(let d=1;d<=daysInMon;d++){
      if(new Date(viewYear,viewMonth,d)>today) break;
      days++;
      const data=getDayData(dayKey(viewYear,viewMonth,d));
      if(data[h.id]) cnt++;
    }
    const pct=days>0?Math.round(cnt/days*100):0;
    const row=document.createElement('div');
    row.className='breakdown-row';
    row.innerHTML=`
      <span class="breakdown-icon">${h.icon}</span>
      <div class="breakdown-info">
        <div class="breakdown-name">${h.name}</div>
        <div class="breakdown-bar-wrap">
          <div class="breakdown-bar-fill" style="width:${pct}%;background:${h.color}"></div>
        </div>
      </div>
      <span class="breakdown-pct" style="color:${h.color}">${pct}%</span>`;
    list.appendChild(row);
  });
}

function showPage(name) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  document.querySelectorAll('.tab-btn')[name==='today'?0:1].classList.add('active');
  if(name==='month') renderMonth();
}

function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

function scheduleMidnight() {
  const now=new Date();
  const ms=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1)-now;
  setTimeout(()=>{ renderToday(); showToast('🌙 يوم جديد! قائمتك جاهزة'); scheduleMidnight(); }, ms);
}

setGreeting();
renderToday();
scheduleMidnight();
</script>
