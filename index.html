<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>يوميتي</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1209;
    --paper: #f5efe0;
    --paper-dark: #ede3c8;
    --gold: #c8913a;
    --gold-light: #e8b560;
    --rust: #8b3a2a;
    --sage: #4a6741;
    --cream: #faf6ed;
    --shadow: rgba(26,18,9,0.15);
    --line: rgba(200,145,58,0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #2c1f0e;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 20px;
    font-family: 'Cairo', sans-serif;
    background-image: 
      radial-gradient(ellipse at 20% 50%, rgba(139,58,42,0.15) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(200,145,58,0.1) 0%, transparent 50%);
  }

  .journal {
    width: 100%;
    max-width: 680px;
    background: var(--paper);
    border-radius: 4px 12px 12px 4px;
    box-shadow: 
      -6px 0 0 #1a0f05,
      0 20px 60px rgba(0,0,0,0.6),
      inset -2px 0 8px rgba(0,0,0,0.05);
    position: relative;
    overflow: hidden;
    min-height: 90vh;
  }

  /* Spine */
  .journal::before {
    content: '';
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    width: 40px;
    background: linear-gradient(to left, #8b6914, #c8913a, #e8b560, #c8913a, #8b6914);
    z-index: 10;
  }

  /* Page lines */
  .journal::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(
      transparent,
      transparent 35px,
      var(--line) 35px,
      var(--line) 36px
    );
    background-position: 0 80px;
    pointer-events: none;
    z-index: 0;
  }

  .journal-inner {
    padding: 40px 60px 60px 30px;
    position: relative;
    z-index: 1;
  }

  /* Decorative corner */
  .corner-ornament {
    position: absolute;
    top: 20px;
    left: 20px;
    width: 60px;
    height: 60px;
    opacity: 0.3;
    z-index: 2;
  }

  .header {
    text-align: center;
    margin-bottom: 40px;
    padding-bottom: 24px;
    border-bottom: 2px solid var(--gold);
    position: relative;
  }

  .header::after {
    content: '❧';
    position: absolute;
    bottom: -14px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--paper);
    padding: 0 12px;
    color: var(--gold);
    font-size: 18px;
  }

  .journal-title {
    font-family: 'Amiri', serif;
    font-size: 48px;
    color: var(--rust);
    line-height: 1;
    letter-spacing: 2px;
    text-shadow: 2px 2px 0 rgba(139,58,42,0.1);
  }

  .journal-subtitle {
    font-size: 13px;
    color: var(--gold);
    letter-spacing: 3px;
    margin-top: 6px;
    font-weight: 300;
    text-transform: uppercase;
  }

  .date-section {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
    padding: 16px 20px;
    background: var(--paper-dark);
    border-radius: 8px;
    border: 1px solid var(--line);
  }

  .date-label {
    font-family: 'Amiri', serif;
    font-size: 14px;
    color: #8b6030;
    letter-spacing: 1px;
  }

  .date-value {
    font-family: 'Amiri', serif;
    font-size: 20px;
    color: var(--rust);
    font-weight: 700;
  }

  .progress-ring {
    position: relative;
    width: 64px;
    height: 64px;
  }

  .progress-ring svg {
    transform: rotate(-90deg);
  }

  .progress-ring circle {
    fill: none;
    stroke-width: 4;
  }

  .progress-ring .track { stroke: var(--paper-dark); }
  .progress-ring .fill { 
    stroke: var(--sage); 
    stroke-linecap: round;
    transition: stroke-dashoffset 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .progress-text {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .progress-count {
    font-size: 16px;
    font-weight: 700;
    color: var(--sage);
    line-height: 1;
  }

  .progress-total {
    font-size: 9px;
    color: #8b6030;
    margin-top: 1px;
  }

  .section-title {
    font-family: 'Amiri', serif;
    font-size: 22px;
    color: var(--rust);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(to left, transparent, var(--gold));
  }

  .habits-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 40px;
  }

  .habit-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    background: var(--cream);
    border-radius: 8px;
    border: 1px solid rgba(200,145,58,0.2);
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
  }

  .habit-item::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(74,103,65,0.05), transparent);
    opacity: 0;
    transition: opacity 0.4s;
  }

  .habit-item.done {
    background: rgba(74,103,65,0.08);
    border-color: rgba(74,103,65,0.3);
    opacity: 0.55;
    transform: scale(0.98);
  }

  .habit-item.done::before { opacity: 1; }

  .habit-item.completing {
    animation: completeFlash 0.5s ease;
  }

  @keyframes completeFlash {
    0% { transform: scale(1); }
    30% { transform: scale(1.02); background: rgba(74,103,65,0.15); }
    100% { transform: scale(0.98); }
  }

  .habit-icon {
    font-size: 22px;
    flex-shrink: 0;
    width: 36px;
    text-align: center;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.1));
  }

  .habit-content {
    flex: 1;
  }

  .habit-name {
    font-family: 'Cairo', sans-serif;
    font-size: 15px;
    color: var(--ink);
    font-weight: 600;
    line-height: 1.3;
  }

  .habit-item.done .habit-name {
    text-decoration: line-through;
    color: #7a6a4a;
  }

  .habit-meta {
    font-size: 11px;
    color: #a08050;
    margin-top: 3px;
  }

  .done-btn {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 2px solid var(--gold);
    background: transparent;
    color: var(--gold);
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s ease;
    font-family: 'Cairo', sans-serif;
    font-weight: 700;
  }

  .done-btn:hover {
    background: var(--gold);
    color: white;
    transform: scale(1.1);
  }

  .habit-item.done .done-btn {
    border-color: var(--sage);
    background: var(--sage);
    color: white;
    cursor: default;
  }

  .done-badge {
    display: none;
    font-size: 10px;
    color: var(--sage);
    font-weight: 700;
    letter-spacing: 1px;
    flex-shrink: 0;
  }

  .habit-item.done .done-badge { display: block; }
  .habit-item.done .done-btn { display: none; }

  /* Notes section */
  .notes-section {
    margin-top: 20px;
  }

  .notes-area {
    width: 100%;
    min-height: 140px;
    background: transparent;
    border: none;
    border-bottom: 2px solid var(--line);
    resize: none;
    font-family: 'Amiri', serif;
    font-size: 17px;
    color: var(--ink);
    line-height: 36px;
    padding: 8px 4px;
    outline: none;
    direction: rtl;
  }

  .notes-area::placeholder {
    color: #c8a870;
    font-style: italic;
  }

  /* Motivational quote */
  .quote-section {
    margin: 32px 0;
    padding: 20px 24px;
    background: linear-gradient(135deg, rgba(139,58,42,0.05), rgba(200,145,58,0.08));
    border-right: 4px solid var(--rust);
    border-radius: 0 8px 8px 0;
  }

  .quote-text {
    font-family: 'Amiri', serif;
    font-size: 18px;
    color: var(--rust);
    line-height: 1.8;
    font-style: italic;
  }

  .quote-source {
    font-size: 12px;
    color: var(--gold);
    margin-top: 8px;
    letter-spacing: 1px;
  }

  /* Reset notification */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--sage);
    color: white;
    padding: 12px 24px;
    border-radius: 30px;
    font-size: 14px;
    font-family: 'Cairo', sans-serif;
    z-index: 100;
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }

  .toast.show {
    transform: translateX(-50%) translateY(0);
  }

  /* Completion celebration */
  .confetti-container {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 99;
    display: none;
  }

  .confetti-container.active { display: block; }

  .confetti-dot {
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 2px;
    animation: fall 2s ease-out forwards;
  }

  @keyframes fall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
  }

  .all-done-banner {
    display: none;
    text-align: center;
    padding: 24px;
    background: linear-gradient(135deg, rgba(74,103,65,0.1), rgba(200,145,58,0.1));
    border-radius: 12px;
    border: 2px solid var(--sage);
    margin-top: 20px;
  }

  .all-done-banner.show { display: block; animation: fadeInUp 0.5s ease; }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .all-done-banner .big-check { font-size: 40px; margin-bottom: 8px; }
  .all-done-banner h3 {
    font-family: 'Amiri', serif;
    font-size: 24px;
    color: var(--sage);
    margin-bottom: 4px;
  }
  .all-done-banner p { font-size: 13px; color: #7a6a4a; }
</style>
</head>
<body>

<div class="confetti-container" id="confetti"></div>

<div class="journal">
  <div class="journal-inner">

    <header class="header">
      <div class="journal-title">يوميتي</div>
      <div class="journal-subtitle">مساء الخير · Bonsoir</div>
    </header>

    <div class="date-section">
      <div>
        <div class="date-label">التاريخ</div>
        <div class="date-value" id="today-date">—</div>
      </div>
      <div class="progress-ring">
        <svg width="64" height="64" viewBox="0 0 64 64">
          <circle class="track" cx="32" cy="32" r="28" />
          <circle class="fill" cx="32" cy="32" r="28" id="progress-circle"
            stroke-dasharray="175.9"
            stroke-dashoffset="175.9" />
        </svg>
        <div class="progress-text">
          <span class="progress-count" id="done-count">0</span>
          <span class="progress-total" id="total-count">/ 9</span>
        </div>
      </div>
    </div>

    <div class="quote-section">
      <div class="quote-text">« مَن لم يُربِّ نفسَه على العادات الجيدة، لم يَمتلك حياةً جيدة »</div>
      <div class="quote-source">حكمة يومية</div>
    </div>

    <div class="section-title">عاداتي اليومية</div>

    <ul class="habits-list" id="habits-list">
      <!-- Habits injected by JS -->
    </ul>

    <div class="all-done-banner" id="all-done-banner">
      <div class="big-check">🌟</div>
      <h3>أحسنت! أكملت يومك بنجاح</h3>
      <p>تُجدَّد القائمة تلقائيًا في منتصف الليل · Les habitudes seront renouvelées à minuit</p>
    </div>

    <div class="notes-section">
      <div class="section-title">أفكاري اليوم</div>
      <textarea class="notes-area" id="notes-area" 
        placeholder="اكتب أفكارك، ملاحظاتك، أو ما تشعر به اليوم..."></textarea>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const HABITS = [
  { id: 'quran',    icon: '📖', name: 'أقرأ صفحتين من القرآن الكريم',           meta: 'قراءة يومية · Lecture quotidienne' },
  { id: 'podcast',  icon: '🎧', name: 'أستمع لبودكاست بالفرنسية',               meta: '15 دقيقة · 15 minutes' },
  { id: 'book',     icon: '📚', name: 'أقرأ صفحتين من كتاب بالفرنسية',         meta: 'قراءة · Lecture en français' },
  { id: 'conj',     icon: '✏️', name: 'أدرس التصريف الفرنسي',                   meta: '10 دقائق · Conjugaison 10 min' },
  { id: 'speak',    icon: '💬', name: 'أتحدث مع شخص بالفرنسية',                 meta: '15 دقيقة · Conversation 15 min' },
  { id: 'write',    icon: '🖊️', name: 'أكتب صفحة من أفكاري',                   meta: 'يوميتي الكتابية · Journal écrit' },
  { id: 'domains',  icon: '🔍', name: 'أبحث عن الدومينات',                      meta: 'فرص الأعمال · Opportunités' },
  { id: 'client',   icon: '🤝', name: 'أبحث عن عميل لتصميم موقع',              meta: 'عمل حر · Freelance' },
  { id: 'review',   icon: '📝', name: 'أراجع دروسي',                            meta: 'مراجعة يومية · Révision' },
];

const TOTAL = HABITS.length;
const CIRCUMFERENCE = 175.9;
let state = {}; // { habitId: true/false }
let notes = '';

function getTodayKey() {
  return new Date().toISOString().slice(0, 10);
}

function loadState() {
  const key = getTodayKey();
  const saved = localStorage.getItem('journal_' + key);
  state = saved ? JSON.parse(saved) : {};
  const savedNotes = localStorage.getItem('notes_' + key);
  notes = savedNotes || '';
}

function saveState() {
  const key = getTodayKey();
  localStorage.setItem('journal_' + key, JSON.stringify(state));
  localStorage.setItem('notes_' + key, document.getElementById('notes-area').value);
}

function getDoneCount() {
  return Object.values(state).filter(Boolean).length;
}

function updateProgress() {
  const done = getDoneCount();
  document.getElementById('done-count').textContent = done;
  const pct = done / TOTAL;
  const offset = CIRCUMFERENCE * (1 - pct);
  document.getElementById('progress-circle').style.strokeDashoffset = offset;

  const banner = document.getElementById('all-done-banner');
  if (done === TOTAL) {
    banner.classList.add('show');
    if (done === TOTAL && !banner.dataset.celebrated) {
      banner.dataset.celebrated = '1';
      celebrate();
    }
  } else {
    banner.classList.remove('show');
  }
}

function renderHabits() {
  const list = document.getElementById('habits-list');
  list.innerHTML = '';
  HABITS.forEach(h => {
    const done = !!state[h.id];
    const li = document.createElement('li');
    li.className = 'habit-item' + (done ? ' done' : '');
    li.id = 'habit-' + h.id;
    li.innerHTML = `
      <span class="habit-icon">${h.icon}</span>
      <div class="habit-content">
        <div class="habit-name">${h.name}</div>
        <div class="habit-meta">${h.meta}</div>
      </div>
      <span class="done-badge">✓ أنجزت</span>
      <button class="done-btn" onclick="completeHabit('${h.id}')" title="إنجاز">✓</button>
    `;
    list.appendChild(li);
  });
}

function completeHabit(id) {
  if (state[id]) return;
  state[id] = true;
  saveState();

  const el = document.getElementById('habit-' + id);
  el.classList.add('completing');
  setTimeout(() => {
    el.classList.remove('completing');
    el.classList.add('done');
    el.querySelector('.done-btn').style.display = 'none';
    el.querySelector('.done-badge').style.display = 'block';
  }, 300);

  updateProgress();

  const habit = HABITS.find(h => h.id === id);
  showToast('✓ أنجزت: ' + habit.name);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

function celebrate() {
  const container = document.getElementById('confetti');
  container.classList.add('active');
  const colors = ['#c8913a', '#4a6741', '#8b3a2a', '#e8b560', '#2c7a4e'];
  for (let i = 0; i < 40; i++) {
    const dot = document.createElement('div');
    dot.className = 'confetti-dot';
    dot.style.cssText = `
      left: ${Math.random() * 100}%;
      top: -10px;
      background: ${colors[Math.floor(Math.random() * colors.length)]};
      animation-delay: ${Math.random() * 1.5}s;
      animation-duration: ${1.5 + Math.random()}s;
      width: ${6 + Math.random() * 8}px;
      height: ${6 + Math.random() * 8}px;
    `;
    container.appendChild(dot);
  }
  setTimeout(() => {
    container.classList.remove('active');
    container.innerHTML = '';
  }, 3500);
}

function setDate() {
  const now = new Date();
  const opts = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
  document.getElementById('today-date').textContent = now.toLocaleDateString('ar-DZ', opts);
}

// Auto-reset at midnight
function checkMidnightReset() {
  const now = new Date();
  const msUntilMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1) - now;
  setTimeout(() => {
    state = {};
    saveState();
    renderHabits();
    updateProgress();
    setDate();
    showToast('🌙 يوم جديد! قائمتك جاهزة من جديد');
    checkMidnightReset();
  }, msUntilMidnight);
}

// Notes autosave
document.addEventListener('DOMContentLoaded', () => {
  loadState();
  setDate();
  renderHabits();
  updateProgress();

  const notesEl = document.getElementById('notes-area');
  notesEl.value = notes;
  notesEl.addEventListener('input', saveState);

  checkMidnightReset();
});
</script>
</body>
</html>
